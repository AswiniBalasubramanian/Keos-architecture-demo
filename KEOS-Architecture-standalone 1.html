  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

Index = null;\n\nfunction liveIndexOf(a){\n  const out = {};\n  const put = (l, tools) => { if (l) out[l] = (out[l] || []).concat(tools.map(t => t.n)); };\n  (a.left || []).forEach(g => put(g.label, g.tools));\n  (a.right || []).forEach(g => put(g.label, g.tools));\n  (a.layers || []).forEach(ly => ly.groups.forEach(g => g.subs.forEach(s => put(s.label || g.label, s.tools))));\n  return out;\n}\n\nconst DIFF_BADGE = {\n  gone:  '<span title=\"Not in the current version — removed after this one\" style=\"display:flex;align-items:center;justify-content:center;flex:0 0 auto;width:15px;height:15px;border-radius:4px;background:#B5690B;color:#fff;font:700 11px/1 Figtree,sans-serif\">−<\u002Fspan>',\n  added: '<span title=\"Added after this version — not present here\" style=\"display:flex;align-items:center;justify-content:center;flex:0 0 auto;width:15px;height:15px;border-radius:4px;background:#17603A;color:#fff;font:700 11px/1 Figtree,sans-serif\">+<\u002Fspan>'\n};\n\n// Ghost chips for components that exist in the live architecture but not in the version being viewed.\nfunction ghostChips(label, shownTools){\n  if (!previewLiveIndex || !label) return '';\n  const here = shownTools.map(t => t.n.toLowerCase());\n  const addedLater = (previewLiveIndex[label] || []).filter(n => here.indexOf(n.toLowerCase()) === -1);\n  return addedLater.map(n =>\n    '<span data-tip-name=\"' + escAttr(n) + '\" data-tip-cat=\"' + escAttr(label) + '\"' +\n    ' data-tip-desc=\"' + escAttr('Added after this version. It is part of the current architecture but was not present here.') + '\"' +\n    ' style=\"display:flex;align-items:center;gap:7px;background:#F2F8F4;border:1.5px dashed #17603A;border-radius:8px;padding:4px 9px 4px 5px;opacity:.75;cursor:default\">' +\n      DIFF_BADGE.added +\n      '<span style=\"font:500 11.5px/1.15 Figtree,sans-serif;color:#17603A;white-space:nowrap;text-decoration:line-through;text-decoration-color:rgba(23,96,58,.35)\">' + esc(n) + '<\u002Fspan><\u002Fspan>'\n  ).join('');\n}\n\nconst INFO_ICON_SVG = (c) => '<svg width=\"13\" height=\"13\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"' + c + '\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:0 0 auto;display:block\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 16v-4\"/><path d=\"M12 8h.01\"/><\u002Fsvg>';\nconst INFO_ICON = INFO_ICON_SVG('#B01030');\n\nfunction chip(t, size, removePath, flagLabel){\n  // Preview mode: is this component missing from the current live architecture?\n  const gone = !!(previewLiveIndex && flagLabel &&\n    (previewLiveIndex[flagLabel] || []).map(n => n.toLowerCase()).indexOf(t.n.toLowerCase()) === -1);\n  const fit = (flagUnsuitable && flagLabel) ? checkFit(t.n, flagLabel, t) : null;\n  const bad = !!fit;\n  const isRisk = bad && fit.level === 'risk';\n  const tone = isRisk ? '#B01030' : '#B5690B';\n  const textCol = gone ? '#8A5008' : (bad ? (isRisk ? '#8E0D27' : '#8A5008') : '#232426');\n  const nameStyle = size === 'rail'\n    ? \"font:500 11.5px/1.15 Figtree,sans-serif;color:\" + textCol + \";white-space:nowrap\"\n    : \"font:500 12px/1.15 Figtree,sans-serif;color:\" + textCol + \";white-space:nowrap\";\n  const mark = t.ic\n    ? '<span style=\"width:20px;height:20px;flex:0 0 auto;border-radius:5px;background:#F4F4F5;display:flex;align-items:center;justify-content:center\"><img src=\"' + t.ic + '\" alt=\"\" style=\"width:15px;height:15px;object-fit:contain;display:block\"><\u002Fspan>'\n    : '<span style=\"width:20px;height:20px;flex:0 0 auto;border-radius:5px;background:#EDEDEE;display:flex;align-items:center;justify-content:center;font:500 9px/1 \\'DM Mono\\',monospace;color:#6E7378\">' + esc(t.ini) + '<\u002Fspan>';\n  const removeBtn = removePath\n    ? '<button type=\"button\" data-remove-path=\"' + removePath + '\" title=\"Remove\" style=\"all:unset;cursor:pointer;color:#B01030;font:700 12px/1 Figtree,sans-serif;padding:0 2px;line-height:1\">✕<\u002Fbutton>'\n    : '';\n  const meta = techMeta(t.n);\n  const tipData = ' data-tip-name=\"' + escAttr(t.n) + '\"' +\n                  ' data-tip-cat=\"' + escAttr(meta.category || (flagLabel || '')) + '\"' +\n                  ' data-tip-desc=\"' + escAttr(gone ? 'Removed after this version — it is not part of the current architecture. ' + meta.desc : meta.desc) + '\"' +\n                  (bad ? ' data-tip-risk=\"' + escAttr(fit.msg) + '\" data-tip-level=\"' + fit.level + '\"' : '');\n  const infoBtn = (bad && !gone)\n    ? '<span style=\"display:flex;align-items:center;cursor:help;padding:0 1px\">' + INFO_ICON_SVG(tone) + '<\u002Fspan>'\n    : '';\n  const shell = gone\n    ? 'background:#FDF7EF;border:1.5px dashed #B5690B'\n    : (bad\n        ? (isRisk\n            ? 'background:#FDF3F5;border:1.5px solid #B01030;box-shadow:0 0 0 3px rgba(176,16,48,.08)'\n            : 'background:#FDF7EF;border:1.5px dashed #B5690B;box-shadow:0 0 0 3px rgba(181,105,11,.08)')\n        : 'background:#fff;border:1px solid #E3E3E5');\n  return '<span' + tipData + ' style=\"display:flex;align-items:center;gap:7px;' + shell + ';border-radius:8px;padding:4px 9px 4px 5px;cursor:default\">' +\n    (gone ? DIFF_BADGE.gone : mark) + '<span style=\"' + nameStyle + '\">' + esc(t.n) + '<\u002Fspan>' + infoBtn + removeBtn + '<\u002Fspan>';\n}\n\nfunction railBlock(g, editable, side, gi){\n  const addBtn = editable ? '<button type=\"button\" data-add-path=\"rail:' + side + ':' + gi + '\" style=\"' + ADD_BTN_STYLE + '\">+ Add<\u002Fbutton>' : '';\n  return '<div data-group-path=\"rail:' + side + ':' + gi + '\" style=\"padding:4px 2px 14px;border-bottom:1px solid #F1F1F2;border-radius:8px;transition:box-shadow 240ms ease,background 240ms ease\">' +\n    '<div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:10px\"><span style=\"font:500 9.5px/1.5 \\'DM Mono\\',monospace;letter-spacing:.7px;text-transform:uppercase;color:' + g.color + '\">' + esc(g.label) + '<\u002Fspan>' + addBtn + ' nst order = [];\n  const push = t => {\n    const k = (t.n || '').toLowerCase();\n    if (!t.n || seen[k] || existing.indexOf(k) !== -1) return;\n    seen[k] = T([t.n, t.ic || null]);\n    order.push(k);\n  };\n  const archBase = (activeArch() || {}).base || 'aws';\n  const baseTools = toolsFromProfile(archBase, path);\n  if (baseTools) baseTools.forEach(push);\n  (CATALOG[label] || []).forEach(pair => push({ n: pair[0], ic: pair[1] || null }));\n  ['aws','gcp','azure','composable'].forEach(pid => {\n    if (pid === archBase) return;\n    const ts = toolsFromProfile(pid, path);\n    if (ts) ts.forEach(push);\n  });\n  // Relevance: same-cloud or cloud-neutral first; rival-cloud options grouped separately\n  const baseCloud = { aws:'AWS', gcp:'GCP', azure:'Azure' }[archBase] || null;\n  const recommended = [], others = [];\n  order.forEach(k => {\n    const t = seen[k];\n    const c = cloudOf(t.n);\n    if (!c || (baseCloud && c === baseCloud)) recommended.push(t);\n    else others.push(t);\n  });\n  return { label: label, recommended: recommended, others: others, baseCloud: baseCloud };\n}\n\n/* ---------- validation ---------- */\nconst CRITICAL = {\n  'Authentication & Authorization': 'no identity provider — users and agents cannot be authenticated',\n  'Security Guardrails': 'no guardrails — prompt injection and unsafe output are unmitigated',\n  'Compliance & PII': 'no PII controls — regulated data may reach model providers',\n  'Observability': 'no observability — agent failures and cost spikes go undetected',\n  'Foundation Models': 'no model selected — the intelligence layer cannot serve requests',\n  'Model Gateway / Hosting': 'no gateway — there is no governed access path to models',\n  'Vector Store': 'no vector store — retrieval grounding is unavailable',\n  'Agent Frameworks': 'no agent framework — nothing executes agent workflows',\n  'Tool Protocol': 'no tool protocol — agents cannot invoke enterprise systems',\n};\n\nfunction cloudOf(name){\n  if (/\\b(on aws|aws|amazon|bedrock|sagemaker|dynamodb|elasticache|redshift|athena|kinesis|neptune|textract|macie|cognito|deequ|outposts|eks|msk|mwaa)\\b/i.test(name)) return 'AWS';\n  if (/\\b(on gcp|gcp|google|vertex|bigquery|biglake|spanner|firestore|looker|dataplex|dataflow|gke|alloydb|memorystore|apigee)\\b/i.test(name)) return 'GCP';\n  if (/\\b(on azure|azure|microsoft|entra|fabric|power bi|synapse|cosmos db|purview|sharepoint|onedrive)\\b/i.test(name)) return 'Azure';\n  return null;\n}\n\nfunction canonicalCategories(name){\n  const k = name.toLowerCase();\n  const hits = [];\n  Object.keys(CATALOG).forEach(cat => {\n    if (CATALOG[cat].some(p => p[0].toLowerCase() === k)) hits.push(cat);\n  });\n  return hits;\n}\n\n// Checks a single tool against a target category. Returns null or {level,msg}\n// - known component in the wrong category  -> risk    (red, blocks save)\n// - custom component not in the catalog    -> warn    (amber, safe but unverified)\nfunction checkFit(name, label, tool){\n  const cats = canonicalCategories(name);\n  if (cats.length && label && cats.indexOf(label) === -1) {\n    return { level: 'risk', msg: '\"' + name + '\" is normally a ' + cats[0] + ' component — placing it under ' + label + ' is a layer mismatch.' };\n  }\n  if (!cats.length && tool && tool.custom) {\n    return { level: 'warn',\n      msg: '\"' + name + '\" is a custom component, not in the KEOS catalog — its placement under ' + label + ' is unverified.' +\n           (tool.desc ? ' Recorded as: ' + tool.desc : '') };\n  }\n  return null;\n}\n\n// Resolve a category label back to its canvas path, so findings can be acted on.\nfunction pathForLabel(label){\n  const A = activeArch();\n  if (!A || !label) return null;\n  let hit = null;\n  (A.left || []).forEach((g,gi) => { if (!hit && g.label === label) hit = 'rail:left:' + gi; });\n  (A.right || []).forEach((g,gi) => { if (!hit && g.label === label) hit = 'rail:right:' + gi; });\n  (A.layers || []).forEach((ly,li) => ly.groups.forEach((g,gi) => g.subs.forEach((s,si) => {\n    if (!hit && (s.label || g.label) === label) hit = 'layer:' + li + ':' + gi + ':' + si;\n  })));\n  return hit;\n}\n\n// Builds { categoryLabel: [tools] } across every rail and layer\nfunction categoryIndex(){\n  const idx = {};\n  const put = (label, tools) => {\n    if (!label) return;\n    idx[label] = (idx[label] || []).concat(tools);\n  };\n  const A = activeArch();\n  if (!A) return idx;\n  (A.left || []).forEach(g => put(g.label, g.tools));\n  (A.right || []).forEach(g => put(g.label, g.tools));\n  (A.layers || []).forEach(ly => ly.groups.forEach(g => g.subs.forEach(s => put(s.label || g.label, s.tools))));\n  return idx;\n}\n\n// Cross-layer architecture analysis: are the layers coherent as a whole?\nfunction crossLayerChecks(idx){\n  const out = [];\n  const has = c => (idx[c] || []).length > 0;\n  const names = c => (idx[c] || []).map(t => t.n);\n  const any = (c, re) => names(c).some(n => re.test(n));\n\n  const agents      = has('Agent Frameworks');\n  const models      = has('Foundation Models');\n  const gateway     = has('Model Gateway / Hosting');\n  const memory      = has('Agent Memory');\n  const vector      = has('Vector Store');\n  const graph       = has('Graph Database');\n  const tools       = has('Tool Protocol');\n  const evals       = has('Eval & Simulation');\n  const registry    = has('Registry & Lifecycle');\n  const obs         = has('Observability');\n  const guardrails  = has('Security Guardrails');\n  const pii         = has('Compliance & PII');\n  const authz       = has('Authentication & Authorization');\n  const etl         = has('Integration / ETL');\n  const crawl       = has('Crawling & Extraction');\n  const stream      = has('Streaming & Messaging');\n  const orch        = has('Orchestration');\n  const apiPlat     = has('API Platform');\n  const dq          = has('Data Quality Guards');\n  const finops      = has('FinOps');\n  const sessionKV   = has('Session / KV Store');\n  const sources     = ['ERP','CRM','HCM','ITSM','Operational Databases'].some(has);\n  const unstructured= ['Collaboration & Documents','Email'].some(has);\n  const publicCloud = has('Public Cloud');\n  const onPrem      = has('On-Premise / Private / Hybrid');\n\n  const R = (m, cat) => out.push({ level:'risk', msg:'Cross-layer — ' + m, label: cat || null, fix: cat ? { kind:'add', label:cat } : null });\n  const A = (m, cat) => out.push({ level:'warn', msg:'Cross-layer — ' + m, label: cat || null, fix: cat ? { kind:'add', label:cat } : null });\n\n  // Execution chain: 06A agents → 05 models → gateway\n  if (agents && !models) R('agents are configured in KEOS Orbis but no model is selected in KEOS Intelligence — agents have nothing to reason with.', 'Foundation Models');\n  if (models && !gateway) R('foundation models are used without a model gateway — access is ungoverned, with no routing, quota or audit trail.', 'Model Gateway / Hosting');\n  if (gateway && !models) A('a model gateway is defined but no foundation model sits behind it.', 'Foundation Models');\n\n  // Grounding chain: 03 knowledge → 02 ingestion\n  if ((vector || graph) && !(etl || crawl)) R('KEOS Nexus has a knowledge store but KEOS Bridge has no ingestion path — the index will never be populated.', 'Integration / ETL');\n  if (agents && !vector && !graph) A('agents run without a vector or graph store — responses will be ungrounded and prone to hallucination.', 'Vector Store');\n  if (sources && !etl) R('business systems are connected in KEOS Source but KEOS Bridge has no integration path — that data cannot reach the platform.', 'Integration / ETL');\n  if (unstructured && !crawl) A('unstructured sources are listed but no extraction tooling is defined — documents and mail will stay unusable.', 'Crawling & Extraction');\n\n  // State: 04 memory\n  if (agents && !memory) A('agents have no contextual memory — every interaction restarts with no user, role or project continuity.', 'Agent Memory');\n  if (memory && !sessionKV) A('agent memory is defined without a session/KV store — short-term state has nowhere fast to live.', 'Session / KV Store');\n\n  // Action: tool protocol + API platform\n  if (agents && !tools) R('agents have no tool protocol — they can reason but cannot act on enterprise systems.', 'Tool Protocol');\n  if (tools && !apiPlat) A('tools are exposed without an API platform — no rate limiting, versioning or central policy enforcement.', 'API Platform');\n\n  // Lifecycle: 06B\n  if (agents && !evals) R('agents are deployed with no evaluation harness in KEOS Forge — regressions will reach production unnoticed.', 'Eval & Simulation');\n  if (agents && !registry) A('no model or agent registry — versions and rollbacks cannot be tracked.', 'Registry & Lifecycle');\n\n  // Governance rails\n  if (agents && !guardrails) R('agents run without guardrails — prompt injection and unsafe output are unmitigated.', 'Security Guardrails');\n  if (agents && !authz) R('agents run without an identity provider — no way to attribute or authorize their actions.', 'Authentication & Authorization');\n  if (unstructured && !pii) R('unstructured enterprise data is in scope with no PII controls — regulated content may reach model providers.', 'Compliance & PII');\n  if (any('Foundation Models', /claude|openai|gpt|gemini|mistral|deepseek|cohere/i) && !pii)\n    A('third-party hosted models are in use without PII tooling — review what leaves your tenancy.', 'Compliance & PII');\n  if (agents && !obs) R('no observability across the agent runtime — failures, latency and cost spikes go undetected.', 'Observability');\n  if (models && !finops) A('model inference is billed per token with no FinOps tooling — spend will be unattributable.', 'FinOps');\n  if (etl && !dq) A('data is ingested with no quality guards — bad records will silently degrade retrieval quality.', 'Data Quality Guards');\n\n  // Operational coherence\n  if (stream && !orch) A('streaming is defined without an orchestrator — no owner for scheduling, retries or backfills.', 'Orchestration');\n  if (!publicCloud && !onPrem) R('no infrastructure target is selected — the platform has nowhere to run.', 'Public Cloud');\n  if (any('Model Gateway / Hosting', /vllm|ollama|tensorrt|nim/i) && !onPrem)\n    A('self-hosted inference is selected but no private infrastructure is defined to run it on.', 'On-Premise / Private / Hybrid');\n\n  return out;\n}\n\nfunction validateAll(){\n  const issues = [];\n  const visit = (label, tools) => {\n    if (!label) return;\n    if (!tools.length && CRITICAL[label]) {\n      issues.push({ level: 'risk', msg: label + ': ' + CRITICAL[label] + '.', label: label, fix: { kind: 'add', label: label } });\n      return;\n    }\n    // layer-fit\n    tools.forEach((t, ti) => {\n      const f = checkFit(t.n, label, t);\n      if (!f) return;\n      issues.push(Object.assign({}, f, {\n        label: label,\n        fix: f.level === 'risk'\n          ? { kind: 'move', label: label, tool: t.n, target: canonicalCategories(t.n)[0] || null }\n          : { kind: 'prune', label: label }\n      }));\n    });\n    // multi-cloud mixing\n    const clouds = {};\n    tools.forEach(t => { const c = cloudOf(t.n); if (c) clouds[c] = 1; });\n    const cl = Object.keys(clouds);\n    if (cl.length > 1) {\n      issues.push({ level: 'warn', msg: label + ': mixes ' + cl.join(' + ') + ' services — expect egress cost and split operations.', label: label, fix: { kind: 'align', label: label } });\n    }\n    // redundancy\n    if (tools.length > 5) {\n      issues.push({ level: 'warn', msg: label + ': ' + tools.length + ' overlapping tools — consolidation candidate.', label: label, fix: { kind: 'prune', label: label } });\n    }\n  };\n  const A = activeArch();\n  if (!A) return [];\n  (A.left || []).forEach(g => visit(g.label, g.tools));\n  (A.right || []).forEach(g => visit(g.label, g.tools));\n  (A.layers || []).forEach(ly => ly.groups.forEach(g => g.subs.forEach(s => visit(s.label || g.label, s.tools))));\n  const cross = crossLayerChecks(categoryIndex());\n  // Cross-layer findings lead: they describe the architecture, not one box.\n  const all = cross.concat(issues);\n  return all.filter(i => i.level === 'risk').concat(all.filter(i => i.level !== 'risk'));\n}\n\nlet consoleOpen = false;\n\nlet historyOpen = false;\n\nconst CLOCK_ICON = '<svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:0 0 auto;display:block\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 7v5l3 2\"/><\u002Fsvg>';\n\nfunction historyPanel(A){\n  if (!historyOpen || !A) return '';\n  const vs = A.versions.slice().reverse();\n  const rows = vs.map((v, i) => {\n    const isCurrent = A.viewingVersion === null && i === 0;\n    const isViewing = A.viewingVersion === v.n;\n    const prev = A.versions[v.n - 2];\n    const delta = prev ? diffSnaps(prev.snap, v.snap) : 'initial state';\n    const on = isCurrent || isViewing;\n    return '<button type=\"button\" data-version=\"' + v.n + '\" style=\"cursor:pointer;width:100%;text-align:left;display:flex;flex-direction:column;gap:3px;padding:11px 14px;border:none;border-bottom:1px solid #F1F1F2;background:' + (on ? '#FDF3F5' : '#fff') + ';border-left:3px solid ' + (on ? '#B01030' : 'transparent') + '\">' +\n      '<div style=\"display:flex;align-items:center;gap:8px\">' +\n        '<span style=\"font:700 12.5px Figtree,sans-serif;color:#0F1011\">Version ' + v.n + '<\u002Fspan>' +\n        (isCurrent ? '<span style=\"font:600 8.5px/1 \\'DM Mono\\',monospace;letter-spacing:.6px;text-transform:uppercase;color:#17603A;background:#E8F3EC;border-radius:4px;padding:3px 5px\">Current<\u002Fspan>' : '') +\n        (isViewing ? '<span style=\"font:600 8.5px/1 \\'DM Mono\\',monospace;letter-spacing:.6px;text-transform:uppercase;color:#B01030;background:#FBE4E9;border-radius:4px;padding:3px 5px\">Viewing<\u002Fspan> style=\"display:flex;gap:8px\">' +\n              '<button type=\"button\" id=\"hist-exit\" style=\"cursor:pointer;flex:1 1 auto;border:1px solid #DADBDD;background:#fff;color:#5B5D63;border-radius:8px;padding:8px 12px;font:600 12.5px Figtree,sans-serif\">Back to current<\u002Fbutton>' +\n              '<button type=\"button\" id=\"hist-restore\" style=\"cursor:pointer;flex:1 1 auto;border:1px solid #B01030;background:#B01030;color:#fff;border-radius:8px;padding:8px 12px;font:600 12.5px Figtree,sans-serif\">Restore v' + A.viewingVersion + '<\u002Fbutton>' +\n            '<\u002Fdiv>' +\n          '<\u002Fdiv>'\n        : '<div style=\"flex:0 0 auto;border-top:1px solid #E7E7E9;padding:11px 14px;font:500 11px/1.45 Figtree,sans-serif;color:#9A9CA2\">A version is captured each time you press Save.<\u002Fdiv>') +\n    '<\u002Faside>';\n}\n\nfunction validationConsole(){\n  const issues = validateAll();\n  if (!issues.length) return '';\n  const risks = issues.filter(i => i.level === 'risk');\n  const warns = issues.filter(i => i.level === 'warn');\n  const accent = risks.length ? '#B01030' : '#B5690B';\n  const chev = consoleOpen\n    ? '<svg width=\"11\" height=\"11\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"' + accent + '\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6 15l6-6 6 6\"/><\u002Fsvg>'\n    : '<svg width=\"11\" height=\"11\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"' + accent + '\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6 9l6 6 6-6\"/><\u002Fsvg>';\n  const bar =\n    '<button type=\"button\" id=\"val-toggle\" style=\"cursor:pointer;width:100%;display:flex;align-items:center;gap:9px;padding:7px 20px;background:#fff;border:none;border-top:1px solid #E7E7E9;text-align:left\">' +\n      '<span style=\"width:7px;height:7px;border-radius:50%;flex:0 0 auto;background:' + accent + '\"><\u002Fspan>' +\n      '<span style=\"font:600 9.5px/1 \\'DM Mono\\',monospace;letter-spacing:.9 component<\u002Fdiv>' +\n    '<div style=\"font:500 11.5px/1.4 Figtree,sans-serif;color:#9A9CA2;margin-bottom:14px\">' + (grouped.label ? esc(grouped.label) + ' · t' : 'T') + 'ap to select one or more, or type a custom name below.<\u002Fdiv>' +\n    (options.length\n      ? '<div id=\"opt-wrap\" style=\"overflow-y:auto;max-height:290px;margin-bottom:16px\">' + optBody + '<\u002Fdiv>'\n      : '') +\n    '<div style=\"font:600 9.5px/1 \\'DM Mono\\',monospace;letter-spacing:.7px;text-transform:uppercase;color:#9A9CA2;margin-bottom:8px\">Custom name<\u002Fdiv>' +\n    '<div style=\"position:relative;margin-bottom:10px\">' +\n      '<input type=\"text\" id=\"modal-input\" autocomplete=\"off\" placeholder=\"Type a component name\" style=\"width:100%;box-sizing:border-box;border:1px solid #DADBDD;border-radius:8px;padding:9px 11px;font:500 13px Figtree,sans-serif;outline:none\" />' +\n      '<div id=\"ac-list\" style=\"display:none;position:absolute;left:0;right:0;top:100%;margin-top:4px;background:#fff;border:1px solid #E3E3E5;border-radius:9px;box-shadow:0 14px 34px -14px rgba(0,0,0,.35);max-height:190px;overflow-y:auto;z-index:5\"><\u002Fdiv>' +\n    '<\u002Fdiv>' +\n    '<div id=\"desc-wrap\" style=\"display:none;margin-bottom:14px\">' +\n      '<div style=\"font:600 9.5px/1 \\'DM Mono\\',monospace;letter-spacing:.7px;text-transform:uppercase;color:#9A9CA2;margin-bottom:6px\">Description <span style=\"color:#B01030\">*<\u002Fspan><\u002Fdiv>' +\n      '<div style=\"font:500 11px/1.4 Figtree,sans-serif;color:#9A9CA2;margin-bottom:7px\">Not in the KEOS catalog — describe what it does so it can be validated.<\u002Fdiv>' +\n      '<textarea id=\"modal-desc\" rows=\"2\" placeholder=\"e.g. Internal service that brokers entitlement checks for agent tool calls.\" style=\"width:100%;box-sizing:border-box;border:1px solid #DADBDD;border-radius:8px;padding:9px 11px;font:500 12.5px/1.45 Figtree,sans-serif;outline:none;resize:vertical\"><\u002Ftextarea>' +\n    '<\u002Fdiv>' +\n    '<div style=\"display:flex;align-items:center;gap:8px\">' +\n      '<span id=\"sel-count\" style=\"font:500 11.5px Figtree,sans-serif;color:#9A9CA2\"><\u002Fspan>' +\n      '<button type=\"button\" id=\"modal-cancel\" style=\"cursor:pointer;margin-left:auto;border:1px solid #DADBDD;background:#fff;color:#5B5D63;border-radius:8px;padding:8px 14px;font:600 12.5px Figtree,sans-serif\">Cancel<\u002Fbutton>' +\n      '<button type=\"button\" id=\"modal-ok\" style=\"cursor:pointer;border:1px solid #B01030;background:#B01030;color:#fff;border-radius:8px;padding:8px 14px;font:600 12.5px Figtree,sans-serif\">Add<\u002Fbutton>' +\n    '<\u002Fdiv><\u002Fdiv>';\n  document.body.appendChild(overlay);\n  const input = overlay.querySelector('#modal-input');\n  const countEl = overlay.querySelector('#sel-count');\n  const selected = {};\n  function updateCount(){\n    const n = Object.keys(selected).length;\n    countEl.textContent = n ? (n + ' selected') : '';\n  }\n  const wrap = overlay.querySelector('#opt-wrap');\n  if (wrap) wrap.addEventListener('click', function(e){\n    const btn = e.target.closest('[data-opt-idx]');\n    if (!btn) return;\n    const idx = btn.getAttribute('data-opt-idx');\n    if (selected[idx]) {\n      delete selected[idx];\n      btn.setAttribute('aria-pressed','false');\n      btn.style.borderColor = '#E3E3E5';\n      btn.style.background = '#fff';\n      btn.style.boxShadow = 'none';\n    } else {\n      selected[idx] = true;\n      btn.setAttribute('aria-pressed','true');\n      btn.style.borderColor = '#B01030';\n      btn.style.background = 'rgba(176,16,48,.06)';\n      btn.style.boxShadow = 'inset 0 0 0 1px rgba(176,16,48,.35)';\n    }\n    updateCount();\n  });\n  /* ---- autocomplete over the whole catalog + description gate ---- */\n  const acList = overlay.querySelector('#ac-list');\n  const descWrap = overlay.querySelector('#desc-wrap');\n  const descBox = overlay.querySelector('#modal-desc');\n  const ALL = (function(){\n    const seenN = {}, arr = [];\n    Object.keys(CATALOG).forEach(cat => CATALOG[cat].forEach(pair => {\n      const k = pair[0].toLowerCase();\n      if (!seenN[k]) { seenN[k] = 1; arr.push({ n: pair[0], ic: pair[1] || null, cat: cat }); }\n    }));\n    return arr;\n  })();\n  let acItems = [];\n  function knownName(v){\n    const k = v.trim().toLowerCase();\n    return ALL.filter(o => o.n.toLowerCase() === k)[0] || null;\n  }\n  function refreshDescGate(){\n    const v = input.value.trim();\n    const show = v.length > 0 && !knownName(v);\n    descWrap.style.display = show ? 'block' : 'none';\n  }\n  function closeAC(){ acList.style.display = 'none'; acItems = []; }\n  function openAC(){\n    const q = input.value.trim().toLowerCase();\n    if (!q) { closeAC(); return; }\n    const taken = pathTarget(path).map(t => t.n.toLowerCase());\n    acItems = ALL.filter(o => o.n.toLowerCase().indexOf(q) !== -1 && taken.indexOf(o.n.toLowerCase()) === -1).slice(0, 8);\n    if (!acItems.length) { closeAC(); return; }\n    acList.innerHTML = acItems.map((o,i) =>\n      '<div data-ac=\"' + i + '\" style=\"display:flex;align-items:center;gap:8px;padding:7px 10px;cursor:pointer;border-bottom:1px solid #F4F4F5\">' +\n        (o.ic ? '<img src=\"' + o.ic + '\" alt=\"\" style=\"width:14px;height:14px;object-fit:contain;flex:0 0 auto\">' : '<span style=\"width:14px;height:14px;flex:0 0 auto;border-radius:4px;background:#EDEDEE;font:500 8px/14px \\'DM Mono\\',monospace;color:#6E7378;text-align:center\">' + esc(mono(o.n)) + '<\u002Fspan>') +\n        '<span style=\"font:600 12px Figtree,sans-serif;color:#232426\">' + esc(o.n) + '<\u002Fspan>' +\n        '<span style=\"margin-left:auto;font:500 10px Figtree,sans-serif;color:#9A9CA2;white-space:nowrap\">' + esc(o.cat) + '<\u002Fspan><\u002Fdiv>'\n    ).join('');\n    acList.style.display = 'block';\n  }\n  acList.addEventListener('mousedown', function(e){\n    const row = e.target.closest('[data-ac]');\n    if (!row) return;\n    e.preventDefault();\n    input.value = acItems[+row.getAttribute('data-ac')].n;\n    closeAC();\n    refreshDescGate();\n  });\n  input.addEventListener('input', function(){ openAC(); refreshDescGate(); });\n  input.addEventListener('blur', function(){ setTimeout(closeAC, 120); });\n\n  function close(){ overlay.remove(); }\n  overlay.querySelector('#modal-cancel').addEventListener('click', close);\n  overlay.addEventListener('click', function(e){ if (e.target === overlay) close(); });\n  function submit(){\n    const picks = Object.keys(selected).map(i => options[+i]);\n    const customVal = input.value.trim();\n    // New (uncatalogued) component must carry a description\n    if (customVal && !knownName(customVal) && !descBox.value.trim()) {\n      descWrap.style.display = 'block';\n      descBox.style.borderColor = '#B01030';\n      descBox.focus();\n      toast('Describe \"' + customVal + '\" so KEOS can validate where it belongs.', 'warn');\n      return;\n    }\n    const known = customVal ? knownName(customVal) : null;\n    close();\n    const arr = pathTarget(path);\n    picks.forEach(t => arr.push(Object.assign({}, t)));\n    if (customVal) {\n      const t = T([customVal, known ? known.ic : null]);\n      const d = descBox.value.trim();\n      if (d) { t.desc = d; DESC[customVal.toLowerCase()] = d; }\n      if (!known && !canonicalCategories(customVal).length) t.custom = true;\n      arr.push(t);\n    }\n    if (picks.length || customVal) {\n      dirty = true;\n      render();\n      const added = picks.map(t => t.n).concat(customVal ? [customVal] : []);\n      const newTools = pathTarget(path).slice(-(picks.length + (customVal ? 1 : 0)));\n      const bad = newTools.map(t => checkFit(t.n, grouped.label, t)).filter(Boolean);\n      const hardRisk = bad.filter(f => f.level === 'risk')[0];\n      if (hardRisk) toast(hardRisk.msg, 'risk');\n      else if (bad.length) toast('Added — ' + bad[0].msg.replace(/^\"/, '').replace(/\" is a custom component[^—]*—/, 'is custom, so'), 'warn');\n      else {\n        const clouds = {};\n        pathTarget(path).forEach(t => { const c = cloudOf(t.n); if (c) clouds[c] = 1; });\n        const cl = Object.keys(clouds);\n        if (cl.length > 1) toast('Added — note: ' + grouped.label + ' now mixes ' + cl.join(' + ') + '. Expect egress cost and split operations.', 'warn');\n        else if (pathTarget(path).length > 5) toast('Added — ' + grouped.label + ' now has ' + pathTarget(path).length + ' overlapping tools. Consider consolidating.', 'warn');\n        else toast('Good fit — ' + added.join(', ') + ' added to ' + grouped.label + '.', 'ok');\n      }\n    }\n  }\n  overlay.querySelector('#modal-ok').addEventListener('click', submit);\n  input.addEventListener('keydown', function(e){\n    if (e.key === 'Enter') submit();\n    if (e.key === 'Escape') close();\n  });\n  input.focus();\n}\n\ndocument.addEventListener('input', function(e){\n  if (e.target && e.target.id === 'arch-name') {\n    const A = activeArch();\n    if (A) A.name = e.target.value.trim() || 'Untitled Architecture';\n    dirty = true;\n    const flag = document.getElementById('dirty-flag');\n    if (flag) flag.textContent = 'Unsaved changes';\n  }\n});\n\ndocument.addEventListener('focusin', function(e){\n  if (e.target && e.target.id === 'arch-name') {\n    e.target.style.borderColor = '#B01030';\n    e.target.style.background = '#fff';\n  }\n});\ndocument.addEventListener('focusout', function(e){\n  if (e.target && e.target.id === 'arch-name') {\n    e.target.style.borderColor = 'transparent';\n    e.target.style.background = '#F6F6F7';\n    render();\n  }\n});\n\n/* ---------- hover tooltip: name · tech · description · risk ---------- */\nlet tipEl = null;\nfunction hideTip(){ if (tipEl) { tipEl.remove(); tipEl = null; } }\ndocument.addEventListener('mouseover', function(e){\n  const el = e.target.closest('[data-tip-name]');\n  if (!el) return;\n  hideTip();\n  const name = el.getAttribute('data-tip-name');\n  const cat  = el.getAttribute('data-tip-cat');\n  const desc = el.getAttribute('data-tip-desc');\n  const risk = el.getAttribute('data-tip-risk');\n  tipEl = document.createElement('div');\n  tipEl.style.cssText = 'position:fixed;z-index:10001;max-width:320px;background:#0F1011;color:#fff;border-radius:9px;padding:10px 12px;box-shadow:0 14px 34px -12px rgba(0,0,0,.55);font-family:Figtree,system-ui,sans-serif;pointer-events:none';\n  tipEl.innerHTML =\n    '<div style=\"font:700 12.5px/1.3 Figtree,sans-serif;margin-bottom:2px\">' + esc(name) + '<\u002Fdiv>' +\n    (cat ? '<div style=\"font:600 8.5px/1.4 \\'DM Mono\\',monospace;letter-spacing:.7px;text-transform:uppercase;color:#9A9CA2;margin-bottom:6px\">' + esc(cat) + '<\u002Fdiv>' : '') +\n    '<div style=\"font:400 11.5px/1.5 Figtree,sans-serif;color:#D7D8DA\">' + esc(desc) + '<\u002Fdiv>' +\n    (risk\n      ? (function(){\n          const lv = el.getAttribute('data-tip-level') || 'risk';\n          const col = lv === 'risk' ? '#FF9BAF' : '#F5C77E';\n          const lab = lv === 'risk' ? 'Risk' : 'Unverified';\n          return '<div style=\"margin-top:8px;padding-top:7px;border-top:1px solid rgba(255,255,255,.14);font:500 11.5px/1.5 Figtree,sans-serif;color:' + col + '\"><strong style=\"font-weight:700\">' + lab + ' — <\u002Fstrong>' + esc(risk) + '<\u002Fdiv>';\n        })()\n      : '');\n  document.body.appendChild(tipEl);\n  const r = el.getBoundingClientRect();\n  const tr = tipEl.getBoundingClientRect();\n  let top = r.top - tr.height - 8;\n  if (top < 8) top = r.bottom + 8;\n  let left = r.left;\n  if (left + tr.width > window.innerWidth - 10) left = window.innerWidth - tr.width - 10;\n  tipEl.style.top = top + 'px';\n  tipEl.style.left = Math.max(8, left) + 'px';\n});\ndocument.addEventListener('mouseout', function(e){\n  if (e.target.closest('[data-tip-name]')) hideTip();\n});\nwindow.addEventListener('scroll', hideTip, true);\n\nfunction highlightGroup(path){\n  const el = document.querySelector('[data-group-path=\"' + path + '\"]');\n  if (!el) return false;\n  el.scrollIntoView({ behavior:'smooth', block:'center' });\n  el.style.boxShadow = '0 0 0 3px rgba(176,16,48,.45)';\n  el.style.background = '#FDF3F5';\n  setTimeout(() => { el.style.boxShadow = 'none'; el.style.background = ''; }, 1800);\n  return true;\n}\n\ndocument.addEventListener('click', function(e){\n  // Fix with KEOS\n  const fx = e.target.closest('[data-fix-idx]');\n  if (fx) {\n    e.stopPropagation();\n    const issue = validateAll()[+fx.getAttribute('data-fix-idx')];\n    if (!issue || !issue.fix) return;\n    const f = issue.fix;\n    if (f.kind === 'add') {\n      const p = pathForLabel(f.label);\n      if (p) showAddModal(p); else toast('No place to add ' + f.label + ' in this architecture.', 'warn');\n      return;\n    }\n    if (f.kind === 'move') {\n      const from = pathForLabel(f.label);\n      const to = f.target ? pathForLabel(f.target) : null;\n      if (!from) return;\n      const arr = pathTarget(from);\n      const ix = arr.map(t => t.n).indexOf(f.tool);\n      if (ix === -1) return;\n      const [moved] = arr.splice(ix, 1);\n      dirty = true;\n      if (to) {\n        pathTarget(to).push(moved);\n        render();\n        toast('Moved ' + f.tool + ' to ' + f.target + '.', 'ok');\n        setTimeout(() => highlightGroup(to), 60);\n      } else {\n        render();\n        toast('Removed ' + f.tool + ' from ' + f.label + ' — no matching layer exists here.', 'ok');\n      }\n      return;\n    }\n    // prune / align: take the user to the category\n    const p2 = pathForLabel(f.label);\n    if (p2) { highlightGroup(p2); toast('Review ' + f.label + ' — highlighted on the canvas.', 'warn'); }\n    return;\n  }\n  // Click an issue row to highlight it on the canvas\n  const row = e.target.closest('[data-issue-target]');\n  if (row) {\n    if (!highlightGroup(row.getAttribute('data-issue-target'))) toast('That area is not on the canvas.', 'warn');\n    return;\n  }\n  const vt = e.target.closest('#val-toggle');\n  if (vt) {\n    consoleOpen = !consoleOpen;\n    render();\n    return;\n  }\n  const rm = e.target.closest('[data-remove-path]');\n  if (rm) {\n    const rpath = rm.getAttribute('data-remove-path');\n    const rlabel = labelForPath(rpath);\n    const parts = rpath.split(':');\n    const removed = (pathTarget(rpath)[+parts[parts.length - 1]] || {}).n || 'Component';\n    removeAtPath(rpath);\n    dirty = true;\n    render();\n    const left = pathTarget(rpath).length;\n    if (left === 0 && CRITICAL[rlabel]) toast('Risk — ' + rlabel + ': ' + CRITICAL[rlabel] + '.', 'risk');\n    else if (left === 0) toast(rlabel + ' is now empty.', 'warn');\n    else toast('Removed ' + removed + ' — ' + rlabel + ' still has ' + left + '.', 'ok');\n    return;\n  }\n  const add = e.target.closest('[data-add-path]');\n  if (add) {\n    showAddModal(add.getAttribute('data-add-path'));\n    return;\n  }\n  const save = e.target.closest('#arch-save');\n  if (save) {\n    const risks = validateAll().filter(i => i.level === 'risk');\n    if (risks.length && save.getAttribute('data-confirmed') !== '1') {\n      save.setAttribute('data-confirmed', '1');\n      save.textContent = 'Save anyway';\n      toast(risks.length + ' unresolved risk' + (risks.length === 1 ? '' : 's') + ' — review above, then press again to save.', 'risk');\n      return;\n    }\n    const A = activeArch();\n    const prev = A.versions.length ? A.versions[A.versions.length - 1].snap : null;\n    A.saved = snapshotOf(A);\n    const note = prev ? diffSnaps(prev, A.saved) : 'Saved';\n    const n = pushVersion(A, note === 'no component changes' ? 'Saved (no component changes)' : 'Saved — ' + note);\n    dirty = false;\n    editMode = false;\n    render();\n    toast('Saved as version ' + n + ' — ' + A.name, 'ok');\n    return;\n  }\n  const cancel = e.target.closest('#arch-cancel');\n  if (cancel) {\n    const A = activeArch();\n    if (A && A.saved) {\n      restoreInto(A, A.saved);\n      dirty = false;\n      editMode = false;\n      render();\n      toast('Changes discarded');\n    } else {\n      dirty = false;\n      editMode = false;\n      current = 'aws';\n      render();\n    }\n    return;\n  }\n  // ---- version history ----\n  if (e.target.closest('#hist-open')) { historyOpen = true; render(); return; }\n  if (e.target.closest('#hist-close') || e.target.closest('#hist-overlay')) { historyOpen = false; render(); return; }\n  if (e.target.closest('#hist-exit')) {\n    const A = activeArch(); if (A) A.viewingVersion = null;\n    render(); return;\n  }\n  if (e.target.closest('#hist-restore')) {\n    const A = activeArch();\n    if (!A || A.viewingVersion === null) return;\n    const from = A.viewingVersion;\n    restoreInto(A, A.versions[from - 1].snap);\n    A.viewingVersion = null;\n    A.saved = snapshotOf(A);\n    const n = pushVersion(A, 'Restored from version ' + from);\n    historyOpen = false;\n    dirty = false;\n    editMode = false;\n    render();\n    toast('Restored version ' + from + ' as version ' + n + ' — earlier versions kept.', 'ok');\n    return;\n  }\n  const vBtn = e.target.closest('[data-version]');\n  if (vBtn) {\n    const A = activeArch();\n    if (!A) return;\n    const n = +vBtn.getAttribute('data-version');\n    A.viewingVersion = (n === A.versions.length) ? null : n;\n    editMode = false;\n    render();\n    return;\n  }\n  const ed = e.target.closest('#arch-edit');\n  if (ed) {\n    editMode = true;\n    render();\n    return;\n  }\n  const bo = e.target.closest('#build-own');\n  if (bo) {\n    const n = customArchs.length;\n    const suggested = n ? 'Architecture ' + (n + 1) : 'Untitled Architecture';\n    const baseId = (current.indexOf('custom:') === 0) ? ((activeArch() || {}).base || 'aws') : current;\n    showModal({ title: 'Name your architecture', value: suggested, placeholder: 'Untitled Architecture', okLabel: 'Start building', onSubmit: function(name){\n      const a = createArch(name || suggested, baseId);\n      current = 'custom:' + a.id;\n      dirty = false;\n      editMode = true;\n      render();\n    }});\n    return;\n  }\n  const b = e.target.closest('[data-profile]');\n  if (!b) return;\n  const id = b.getAttribute('data-profile');\n  if (id === current) return;\n  const y = window.scrollY;\n  const prevA = activeArch();\n  if (prevA) prevA.viewingVersion = null;\n  current = id;\n  editMode = false;\n  historyOpen = false;\n  render();\n  window.scrollTo(0, y);\n});\n\nrender();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
